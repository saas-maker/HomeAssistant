# ==============================================================================
# 1. DEPLOYMENT VARIABLES (DEFINED HERE ONCE)
# ==============================================================================
# We define these anchors inside 'homeassistant' so the config validator ignores them.
homeassistant:
  customize:
    package.node_anchors:
      installation_id: &id_var !secret installation_id
      project_id: &proj_var "saas-maker-api-project"
      creds_file: &creds_var "saas-maker-api-project-5b20c116b047.json"

  # Apply the ID to every entity automatically using the anchor above
  customize_glob:
    "*.*":
      installation_id: *id_var

# ==============================================================================
# 2. INTEGRATIONS
# ==============================================================================

default_config:

# --- VIVAJOT RENAMER ---
viva_renamer:
  topic: "vivajot-setup"
  project_id: *proj_var
  installation_id: *id_var
  credentials_file: *creds_var

# --- GOOGLE PUBSUB ---
google_pubsub:
  project_id: *proj_var
  credentials_json: *creds_var
  topic_name: "home-assistant-events"
  filter:
    include_entity_globs:
      - "light.*"
      - "sensor.*_power"
      - "sensor.*_power_[0-9]*" # Plug 2, 3, 4...
      - "binary_sensor.*"
      - "sensor.*_temperature"
      - "sensor.*_battery"
      - "sensor.vivajot_pulse"
      - "sensor.vivajot_devices_online"
      - "sensor.vivajot_devices_total"
      - "assist_satellite.*"
      - "stt.*"
      - "tts.*"
    exclude_entity_globs:
      - "*.unnamed*"
      - "binary_sensor.*_opening*"

# --- ZHA WATCHDOG REBOOT BUDGET ---
# Host reboots the ZHA watchdog has performed for the current radio incident.
# Reset 15 minutes after any boot where ZHA came up healthy. Caps a physically
# dead radio at 3 reboot attempts instead of an endless reboot loop.
# --- VOICE INCIDENT STATE & MUTE ---
timer:
  # Started when a help alert is sent, cancelled by "I'm okay". While it runs the
  # speaker says "Your caregiver has already been notified. Do you still need help?"
  # 2 h matches the cloud's incident window (a new "help" within 2 h joins the same
  # incident). Longer made the speaker say "already notified" the next morning
  # about last night's alert. restore: true survives the nightly 3 AM restart.
  vivajot_help_active:
    duration: "02:00:00"
    restore: true

counter:
  vivajot_zha_reboots:
    name: "VivaJot ZHA watchdog reboots"
    initial: 0
    step: 1
    restore: true

# --- STANDARD CONFIGURATION ---
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include templates.yaml

# --- FLEET PATCHER ---
# Downloads and applies the latest VivaJot config from central server.
# IMPORTANT: The update script must NEVER overwrite secrets.yaml.
shell_command:
  update_hub: "curl -sLf https://raw.githubusercontent.com/saas-maker/HomeAssistant/master/ha_updater.sh -o /tmp/vivajot_update.sh && sed -i 's/\r$//' /tmp/vivajot_update.sh && bash /tmp/vivajot_update.sh --update"
  # NOTE: the `ha` CLI is NOT available to shell_command (it runs inside the Core
  # container, not the host) — every `ha ...` call returns 127. The nightly backup
  # now uses the hassio.backup_partial action in automations.yaml instead. This
  # entry is kept only so any stale automation referencing it fails loudly rather
  # than as an unknown action.
  create_backup: "ha backups new --name VivaJot-Nightly"


logger:
  default: warning
  logs:
    homeassistant.components.google_pubsub: debug
    custom_components.viva_renamer: info
