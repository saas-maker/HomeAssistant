# ==============================================================================
# VIVAJOT FLEET AUTOMATIONS
# ==============================================================================

# --- ZHA WATCHDOG ---
# Two different failures, two different remedies:
#  1) Radio / serial port LOST (the Sept 18 2026 25-hour outage). ZHA's config
#     entry falls into setup-retry and its entities vanish, so
#     integration_entities('zha') is EMPTY (that is also why the old action
#     crashed with "invalid entity IDs"). Neither a core restart nor a ZHA reload
#     can reopen a dropped USB port — only a HOST reboot resets the USB bus.
#     Bounded to 3 reboots per incident by counter.vivajot_zha_reboots
#     (configuration.yaml) so a physically dead stick can never loop a hub.
#  2) Radio present but network HUNG: ZHA is loaded, yet every light has been
#     unavailable for 6 hours. Remedy is a ZHA reload, as before. 6 hours, NOT
#     less: consider_unavailable_mains is 15 s, so bulbs switched off at the
#     wall read as "unavailable" — an evening with all lights off is normal, and
#     the 3 AM restart resets the timer. Never tie a host reboot to this signal.
# Template triggers fire only on a false->true transition, so trigger 1 cannot
# catch a hub that BOOTS with a dead radio; the boot trigger covers that case
# (and resets the reboot budget after any boot where ZHA came up healthy).
# now() in the ZHA templates forces a re-check every minute — they reference no
# entity state, so nothing else would ever re-render them.
- id: "vivajot_zha_watchdog"
  alias: "VivaJot ZHA Watchdog"
  description: "Recovers a crashed Zigbee radio: ZHA reload for a hung network, bounded host reboots for a lost radio"
  mode: queued
  trigger:
    - trigger: template
      value_template: "{% set _ = now() %}{{ integration_entities('zha') | count == 0 }}"
      for: "00:15:00"
      id: "zha_down"
    - trigger: homeassistant
      event: start
      id: "boot"
    - trigger: template
      value_template: >
        {% set total = states.light | list | count %}
        {% set dead = states.light | selectattr('state', 'eq', 'unavailable') | list | count %}
        {{ total > 0 and dead == total }}
      for: "06:00:00"
      id: "lights_dead"
  action:
    - choose:
        # Hung network: reload ZHA (only meaningful while ZHA is actually loaded)
        - conditions: "{{ trigger.id == 'lights_dead' and integration_entities('zha') | count > 0 }}"
          sequence:
            - action: homeassistant.reload_config_entry
              target:
                entity_id: "{{ integration_entities('zha') | first }}"
        # 15 minutes after boot: ZHA healthy -> reset the budget; ZHA absent -> reboot (within budget)
        - conditions: "{{ trigger.id == 'boot' }}"
          sequence:
            - delay: "00:15:00"
            - if:
                - condition: template
                  value_template: "{{ integration_entities('zha') | count > 0 }}"
              then:
                - action: counter.reset
                  target:
                    entity_id: counter.vivajot_zha_reboots
              else:
                - condition: numeric_state
                  entity_id: counter.vivajot_zha_reboots
                  below: 3
                - action: counter.increment
                  target:
                    entity_id: counter.vivajot_zha_reboots
                - action: hassio.host_reboot
        # Radio lost while running: reboot the host (within budget)
        - conditions: "{{ trigger.id == 'zha_down' }}"
          sequence:
            - condition: numeric_state
              entity_id: counter.vivajot_zha_reboots
              below: 3
            - action: counter.increment
              target:
                entity_id: counter.vivajot_zha_reboots
            - action: hassio.host_reboot

# --- FLEET UPDATE (ON-BOOT) ---
# Pulls latest config 5 minutes after a system reboot.
# The nightly reboot automation handles the schedule — no separate time trigger needed.
- id: "vivajot_fleet_update"
  alias: "VivaJot Fleet Update"
  description: "Pulls latest configuration from central server on boot"
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    # ANTI-BOOT-LOOP SAFETY: Only allow updates if this automation hasn't run in the last 15 minutes.
    # The update cycle takes ~7 min (5 min delay + download + restart), so 15 min safely prevents loops
    # while still allowing manual reboots to pull updates promptly.
    - condition: template
      value_template: "{{ state_attr('automation.vivajot_fleet_update', 'last_triggered') == None or (as_timestamp(now()) - as_timestamp(state_attr('automation.vivajot_fleet_update', 'last_triggered'))) > 900 }}"
  action:
    # Wait 5 minutes after boot to ensure Wi-Fi and network are fully connected before downloading
    - delay: "00:05:00"
    - action: shell_command.update_hub
    # Guarantee a reboot even if the update script fails (e.g. internet is down).
    # If the update script already called 'ha core restart', this line is never reached.
    - action: homeassistant.restart

# --- NIGHTLY BACKUP ---
# Creates a local HA backup at 2:45 AM, 15 minutes before the nightly reboot.
# Guarantees every hub has a fresh restore point regardless of whether
# automatic backups were ever enabled in the UI.
# Uses the Supervisor integration's action, not the `ha` CLI: shell_command runs
# inside the Core container, where `ha` does not exist (every `ha ...` call in
# the logs returned 127 "command not found" — no nightly backup ever ran).
# Config-only ("homeassistant: true") keeps each backup to a few MB.
- id: "vivajot_nightly_backup"
  alias: "VivaJot Nightly Backup"
  description: "Creates a config-only backup before the nightly reboot"
  trigger:
    - trigger: time
      at: "02:45:00"
  action:
    - action: hassio.backup_partial
      data:
        name: "VivaJot-Nightly-{{ now().strftime('%Y%m%d') }}"
        homeassistant: true
        compressed: true

# --- NIGHTLY REBOOT ---
# Full HA restart at 3 AM to keep the Zigbee radio healthy.
# This also triggers the fleet update via the boot trigger above.
- id: "vivajot_nightly_reboot"
  alias: "VivaJot Nightly Reboot"
  description: "Restarts Home Assistant nightly to maintain Zigbee stability"
  trigger:
    - trigger: time
      at: "03:00:00"
  action:
    - action: homeassistant.restart

# --- PLUG KEEP-ALIVE ---
# Smart plugs must always stay ON — they are passthrough power monitors.
# Users control appliances physically; the plug just measures wattage spikes.
# Two triggers handle both scenarios:
#   1) Mid-day: only the plug lost power, hub stayed on → template detects it within seconds
#   2) Full outage: hub also rebooted → boot trigger turns on all plugs after ZHA initializes
- id: "vivajot_plug_keepalive"
  alias: "VivaJot Plug Keep-Alive"
  description: "Re-enables smart plugs after power loss"
  mode: restart
  trigger:
    - trigger: template
      value_template: >
        {{ states.switch
           | selectattr('entity_id', 'in', integration_entities('zha'))
           | selectattr('state', 'eq', 'off')
           | list | count > 0 }}
      id: "plugs_off"
    - trigger: homeassistant
      event: start
      id: "full_boot"
  action:
    - delay: "{{ '00:00:10' if trigger.id == 'plugs_off' else '00:02:00' }}"
    - action: switch.turn_on
      target:
        entity_id: >
          {{ states.switch
             | selectattr('entity_id', 'in', integration_entities('zha'))
             | selectattr('state', 'eq', 'off')
             | map(attribute='entity_id') | list }}

# --- VOICE SPEAKER: CATCH-ALL CONVERSATION HANDLER ---
# Classifies all speech after a wake word so nothing ever falls through to Home
# Assistant's built-in intents. Three outcomes only: the all-clear ("I'm okay"
# class), stop, or the "Do you need help?" question. Nothing a resident says is
# ever forwarded in the background or silently dropped.
- id: "vivajot_voice_conversation"
  alias: "VivaJot Voice - Conversation Handler"
  description: "Classifies all post-wake speech: all-clear, stop, or the help question"
  mode: restart
  trigger:
    - trigger: conversation
      command:
        - "{utterance}"
  variables:
    utterance_raw: "{{ (trigger.sentence | default(trigger.slots.utterance | default('', true), true) | string).strip() }}"
    utterance_norm: >
      {{ utterance_raw | lower
         | regex_replace("[^a-z0-9' ]", " ")
         | regex_replace("\\s+", " ")
         | trim
         | regex_replace("^viva ?jot ", "") }}
    is_stop: >
      {{ utterance_norm in [
           'stop', 'shut up', 'be quiet', 'quiet', 'stop talking', 'stop it',
           "that's enough", 'that is enough', 'enough', 'leave me alone', 'no more'
         ] }}
    # The okay class, one definition used everywhere: a statement that they are
    # okay ("I'm okay", "no I'm fine", "I am all right now", "all good", "false
    # alarm", "never mind"). A bare "okay" or "no" is NOT in it (ambiguous).
    is_okay: >
      {{ utterance_norm is search("^(no )?(i'?m|i am) (doing )?(okay|ok|fine|alright|all right|good|all good|safe)( now)?$")
         or utterance_norm is search("^(no )?(all good|false alarm|never ?mind)$")
         or utterance_norm is search("^everything('?s| is) (okay|ok|fine|alright)$")
         or utterance_norm is search("^tell my family (i'?m|i am) (okay|ok|fine)$") }}
    is_help: >
      {{ utterance_norm in [
           'help', 'help help', 'help me', 'help me please', 'please help', 'please help me',
           'i need help', 'i need some help', 'somebody help', 'somebody help me',
           'i fell', 'i fell down', 'i have fallen', "i've fallen", 'i just fell',
           'i cannot get up', "i can't get up", 'i am hurt', "i'm hurt", 'i hurt myself',
           'call my family', 'call for help', 'can you help me', 'call 911', 'get help',
           'emergency', 'send help'
         ] }}
    help_active: "{{ is_state('timer.vivajot_help_active', 'active') }}"
  action:
    - choose:
        # Stop means be quiet, anywhere, any time. Never cancels an alert.
        - conditions: "{{ is_stop }}"
          sequence:
            - action: timer.start
              target:
                entity_id: timer.vivajot_coaching_mute
            - set_conversation_response: "Okay."

        # The all-clear. While an alert is active the family is told (notify);
        # otherwise the cloud still clears any open alert it finds.
        - conditions: "{{ is_okay }}"
          sequence:
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "okay"
                notify: "{{ help_active }}"
                device_id: "{{ trigger.device_id | default('', true) }}"
                details: "{{ utterance_raw }}"
              response_variable: pub_okay
            - if:
                - condition: template
                  value_template: "{{ pub_okay is defined and pub_okay is mapping and pub_okay.get('published') == true }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ help_active }}"
                  then:
                    - action: timer.cancel
                      target:
                        entity_id: timer.vivajot_help_active
                    - set_conversation_response: "Okay, I've told your caregiver you're okay."
                  else:
                    - set_conversation_response: "Okay."
              else:
                - set_conversation_response: "I couldn't send that. Please use your phone."

        # A request for help ("VivaJot, I fell") -> confirm before alerting
        - conditions: "{{ is_help }}"
          sequence:
            - set_conversation_response: ""
            - event: vivajot_confirm_help
              event_data:
                device_id: "{{ trigger.device_id | default('', true) }}"
                heard: "{{ utterance_raw }}"
                opening_question: "I heard you need help. Should I alert your caregiver?"

      # Anything else ("what time is it", "I can't breathe", a mumble) -> the question.
      # Active alert or not: the speaker cannot know whether a caregiver already
      # resolved it, so it always asks rather than ever dropping speech.
      default:
        - set_conversation_response: ""
        - event: vivajot_confirm_help
          event_data:
            device_id: "{{ trigger.device_id | default('', true) }}"
            heard: "{{ utterance_raw }}"
            opening_question: "I'm here. Do you need help?"

# --- VOICE SPEAKER: WAKE WORD "SAID NOTHING" HANDLER ---
# Once the satellite returns to idle after a wake word with no conversation,
# asks "I'm here. Do you need help?". Always, alert active or not: a silent
# wake must never be ignored. Never alerts on its own.
- id: "vivajot_voice_wake_event"
  alias: "VivaJot Voice - Wake Word Idle Handler"
  description: "Asks if the resident needs help when a wake word is followed by silence"
  mode: restart
  trigger:
    - trigger: event
      event_type: esphome.vivajot_wake_word
  variables:
    speaker_name: "{{ trigger.event.data.device_name | default('', true) }}"
    sat_entity: >
      {% set sats = states.assist_satellite | map(attribute='entity_id') | list %}
      {% set match = sats | select('search', speaker_name | replace('-', '_')) | list %}
      {{ match[0] if match | count > 0 else (sats | first | default('', true)) }}
    resolved_device_id: "{{ device_id(sat_entity) | default('', true) if sat_entity != '' else '' }}"
    conv_last_triggered: "{{ state_attr('automation.vivajot_voice_conversation', 'last_triggered') | string }}"
    confirm_last_triggered: "{{ state_attr('automation.vivajot_voice_help_confirm', 'last_triggered') | string }}"
  condition:
    - condition: template
      value_template: "{{ sat_entity != '' }}"
  action:
    # Record every wake with the word that fired, so false wakes can be counted per word in the Logbook
    - action: logbook.log
      continue_on_error: true
      data:
        name: "VivaJot wake"
        message: "{{ trigger.event.data.wake_word | default('?', true) }} on {{ speaker_name }}"
        entity_id: "{{ sat_entity }}"
    # Wait for the satellite to enter the listening/processing pipeline, then wait for it to return to idle
    - wait_template: "{{ states(sat_entity) != 'idle' }}"
      timeout: "00:00:02"
    - wait_template: "{{ states(sat_entity) == 'idle' }}"
      timeout: "00:00:15"
    - delay: "00:00:00.500"
    # Only ask if no conversation matched and a confirmation is not already running
    - condition: template
      value_template: >
        {{ (state_attr('automation.vivajot_voice_conversation', 'last_triggered') | string) == conv_last_triggered
           and (state_attr('automation.vivajot_voice_help_confirm', 'last_triggered') | string) == confirm_last_triggered
           and (state_attr('automation.vivajot_voice_help_confirm', 'current') | int(0)) == 0 }}
    - event: vivajot_confirm_help
      event_data:
        device_id: "{{ resolved_device_id }}"
        heard: ""
        opening_question: "I'm here. Do you need help?"

# --- VOICE SPEAKER: HELP CONFIRMATION & ALERT ---
# Never sends an alert without a yes. Asks once more if unclear or silent.
# Branches the spoken confirmation on whether the Pub/Sub publish succeeded.
- id: "vivajot_voice_help_confirm"
  alias: "VivaJot Voice - Help Confirmation"
  description: "Asks if resident needs help, re-asks once if unclear, and alerts only on yes"
  mode: restart
  trigger:
    - trigger: event
      event_type: vivajot_confirm_help
  variables:
    sat_entity: >
      {% set dev = trigger.event.data.device_id | default('', true) %}
      {% set dev_sats = device_entities(dev) | select('match', '^assist_satellite\.') | list if dev else [] %}
      {{ dev_sats[0] if dev_sats | count > 0 else (states.assist_satellite | map(attribute='entity_id') | first | default('', true)) }}
    opening_question: "{{ trigger.event.data.opening_question | default(\"I'm here. Do you need help?\", true) }}"
    initial_heard: "{{ (trigger.event.data.heard | default('', true) | string).strip() }}"
    # Was an incident already active before this question? Then a yes re-pushes
    # the same incident and the follow-up question is not asked again.
    pre_active: "{{ is_state('timer.vivajot_help_active', 'active') }}"
    stop_words:
      - "stop"
      - "shut up"
      - "be quiet"
      - "quiet"
      - "stop talking"
      - "stop it"
      - "that's enough"
      - "that is enough"
      - "enough"
      - "leave me alone"
      - "no more"
    # Answer lists for both asks (sentence-template syntax: [optional], (a|b)).
    # "yes {extra}" accepts any answer that starts with yes. The no list requires
    # "I'm"/"I am" before okay/fine/... so a bare "okay" stays ambiguous.
    yes_answers:
      - "yes"
      - "yeah"
      - "yep"
      - "please"
      - "yes please"
      - "help"
      - "help me"
      - "help help"
      - "i need help"
      - "please help"
      - "please help me"
      - "i fell"
      - "i fell down"
      - "i have fallen"
      - "i've fallen"
      - "i can't get up"
      - "i cannot get up"
      - "no i need help"
      - "no please help"
      - "yes {extra}"
      - "yeah {extra}"
      - "yep {extra}"
    no_answers:
      - "no"
      - "nope"
      - "no thank you"
      - "no thanks"
      - "no i don't"
      - "no i do not"
      - "i don't need help"
      - "i do not need help"
      - "[no] (i'm|i am) [doing] (okay|ok|fine|alright|all right|good|all good|safe) [now]"
      - "[no] (all good|false alarm|never mind|nevermind)"
      - "everything is (okay|ok|fine|alright)"
  condition:
    - condition: template
      value_template: "{{ sat_entity != '' }}"
  action:
    - action: timer.cancel
      target:
        entity_id: timer.vivajot_coaching_mute
    - delay: "00:00:01"
    - action: assist_satellite.ask_question
      continue_on_error: true
      target:
        entity_id: "{{ sat_entity }}"
      data:
        question: "{{ opening_question }}"
        preannounce: false
        answers:
          - id: "yes"
            sentences: "{{ yes_answers }}"
          - id: "no"
            sentences: "{{ no_answers }}"
      response_variable: ans1
    - variables:
        s1_raw: "{{ (ans1.sentence | default('', true) | string).strip() if ans1 is defined and ans1 is mapping else '' }}"
        id1: "{{ (ans1.id | default('', true)) if ans1 is defined and ans1 is mapping else '' }}"
        ans1_yes: "{{ id1 == 'yes' }}"
        ans1_no: "{{ id1 == 'no' }}"
        s1_norm: >
          {{ s1_raw | lower
             | regex_replace("[^a-z0-9' ]", " ")
             | regex_replace("\\s+", " ")
             | trim
             | regex_replace("^viva ?jot ", "") }}
        ans1_stop: "{{ s1_norm in stop_words }}"
        ans1_heard: "{{ ans1 is defined and ans1 is mapping }}"
    - choose:
        # Stop (with or without "VivaJot"): say Okay, ask nothing more.
        - conditions: "{{ ans1_stop }}"
          sequence:
            - action: timer.start
              target:
                entity_id: timer.vivajot_coaching_mute
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "Okay."
                preannounce: false
        # First ask: clear No
        - conditions: "{{ ans1_no }}"
          sequence:
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "Okay, I won't send anything."
                preannounce: false

        # First ask: clear Yes -> Alert
        - conditions: "{{ ans1_yes }}"
          sequence:
            - variables:
                alert_words: >
                  {{ initial_heard ~ ' (' ~ s1_raw ~ ')'
                     if initial_heard != '' and s1_raw != '' and (initial_heard | lower) != (s1_raw | lower)
                     else (initial_heard if initial_heard != '' else (s1_raw if s1_raw != '' else 'yes')) }}
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "help"
                device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                details: "{{ alert_words }}"
              response_variable: pub1
            - if:
                - condition: template
                  value_template: "{{ pub1 is defined and pub1 is mapping and pub1.get('published') == true }}"
              then:
                - action: timer.start
                  target:
                    entity_id: timer.vivajot_help_active
                - action: timer.cancel
                  target:
                    entity_id: timer.vivajot_coaching_mute
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I've sent your caregiver an alert. Stay where you are."
                    preannounce: false
                - if:
                    - condition: template
                      value_template: "{{ not pre_active }}"
                  then:
                    - event: vivajot_start_fall_coaching
                      event_data:
                        device_id: "{{ trigger.event.data.device_id | default('', true) }}"
              else:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I couldn't send the alert. Please use your phone."
                    preannounce: false

      # First ask was unclear or silent -> Ask once more, unless they said stop
      default:
        - condition: state
          entity_id: timer.vivajot_coaching_mute
          state: idle
        - action: assist_satellite.ask_question
          continue_on_error: true
          target:
            entity_id: "{{ sat_entity }}"
          data:
            question: "Sorry, I didn't catch that. Do you need help? Just say yes or no."
            preannounce: false
            answers:
              - id: "yes"
                sentences: "{{ yes_answers }}"
              - id: "no"
                sentences: "{{ no_answers }}"
          response_variable: ans2
        - variables:
            s2_raw: "{{ (ans2.sentence | default('', true) | string).strip() if ans2 is defined and ans2 is mapping else '' }}"
            id2: "{{ (ans2.id | default('', true)) if ans2 is defined and ans2 is mapping else '' }}"
            ans2_yes: "{{ id2 == 'yes' }}"
            ans2_no: "{{ id2 == 'no' }}"
            s2_norm: >
              {{ s2_raw | lower
                 | regex_replace("[^a-z0-9' ]", " ")
                 | regex_replace("\\s+", " ")
                 | trim
                 | regex_replace("^viva ?jot ", "") }}
            ans2_stop: "{{ s2_norm in stop_words }}"
            ans2_heard: "{{ ans2 is defined and ans2 is mapping }}"
        - choose:
            # Stop (with or without "VivaJot"): say Okay, ask nothing more.
            - conditions: "{{ ans2_stop }}"
              sequence:
                - action: timer.start
                  target:
                    entity_id: timer.vivajot_coaching_mute
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "Okay."
                    preannounce: false
            # Second ask: clear No
            - conditions: "{{ ans2_no }}"
              sequence:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "Okay, I won't send anything."
                    preannounce: false

            # Second ask: clear Yes -> Alert
            - conditions: "{{ ans2_yes }}"
              sequence:
                - variables:
                    alert_words2: >
                      {{ initial_heard ~ ' (' ~ s2_raw ~ ')'
                         if initial_heard != '' and s2_raw != '' and (initial_heard | lower) != (s2_raw | lower)
                         else (initial_heard if initial_heard != '' else (s2_raw if s2_raw != '' else 'yes')) }}
                - action: viva_renamer.voice_alert
                  continue_on_error: true
                  data:
                    intent: "help"
                    device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                    details: "{{ alert_words2 }}"
                  response_variable: pub2
                - if:
                    - condition: template
                      value_template: "{{ pub2 is defined and pub2 is mapping and pub2.get('published') == true }}"
                  then:
                    - action: timer.start
                      target:
                        entity_id: timer.vivajot_help_active
                    - action: timer.cancel
                      target:
                        entity_id: timer.vivajot_coaching_mute
                    - action: assist_satellite.announce
                      continue_on_error: true
                      target:
                        entity_id: "{{ sat_entity }}"
                      data:
                        message: "I've sent your caregiver an alert. Stay where you are."
                        preannounce: false
                    - if:
                        - condition: template
                          value_template: "{{ not pre_active }}"
                      then:
                        - event: vivajot_start_fall_coaching
                          event_data:
                            device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                  else:
                    - action: assist_satellite.announce
                      continue_on_error: true
                      target:
                        entity_id: "{{ sat_entity }}"
                      data:
                        message: "I couldn't send the alert. Please use your phone."
                        preannounce: false
          # Unclear again. If they spoke, say plainly that nothing was sent, so no
          # one believes an alert went out. If the speaker could not listen at all
          # (both asks errored, e.g. speech-to-text down), say that. Silence stays
          # silent.
          default:
            - choose:
                - conditions: "{{ s2_raw != '' }}"
                  sequence:
                    - action: assist_satellite.announce
                      continue_on_error: true
                      target:
                        entity_id: "{{ sat_entity }}"
                      data:
                        message: "I didn't send an alert. If you need help, say VivaJot, help."
                        preannounce: false
                - conditions: "{{ not ans1_heard and not ans2_heard }}"
                  sequence:
                    - action: assist_satellite.announce
                      continue_on_error: true
                      target:
                        entity_id: "{{ sat_entity }}"
                      data:
                        message: "I can't hear you right now. If you need help, please use your phone."
                        preannounce: false

# --- VOICE SPEAKER: FOLLOW-UP CHECK-IN ---
# About 10 seconds after a NEW alert, unless they said stop: "Are you hurt?"
# The answer is added to the same alert and pushed with the resident's words.
# An okay-class answer ("I'm okay", "no I'm fine") is the all-clear, exactly
# as if said on its own. A bare "no" is only an answer.
- id: "vivajot_voice_fall_coaching"
  alias: "VivaJot Voice - Follow-Up Check-In"
  description: "Asks 'Are you hurt?' once about 10s after an alert and forwards the resident's answer"
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: event
      event_type: vivajot_start_fall_coaching
  variables:
    sat_entity: >
      {% set dev = trigger.event.data.device_id | default('', true) %}
      {% set dev_sats = device_entities(dev) | select('match', '^assist_satellite\.') | list if dev else [] %}
      {{ dev_sats[0] if dev_sats | count > 0 else (states.assist_satellite | map(attribute='entity_id') | first | default('', true)) }}
  condition:
    - condition: template
      value_template: "{{ sat_entity != '' }}"
  action:
    - delay: "00:00:10"
    - condition: state
      entity_id: timer.vivajot_help_active
      state: active
    - condition: state
      entity_id: timer.vivajot_coaching_mute
      state: idle
    - condition: template
      value_template: "{{ states(sat_entity) == 'idle' }}"
    - action: assist_satellite.ask_question
      continue_on_error: true
      target:
        entity_id: "{{ sat_entity }}"
      data:
        question: "Are you hurt?"
        preannounce: false
        answers:
          - id: "answered"
            sentences:
              - "{reply}"
      response_variable: coaching_answer
    - variables:
        coaching_raw: >
          {{ (coaching_answer.sentence | default('', true) | string).strip()
             if coaching_answer is defined and coaching_answer is mapping and coaching_answer.sentence is not none
             else '' }}
        coaching_norm: >
          {{ coaching_raw | lower
             | regex_replace("[^a-z0-9' ]", " ")
             | regex_replace("\\s+", " ")
             | trim
             | regex_replace("^viva ?jot ", "") }}
        coaching_is_stop: >
          {{ coaching_norm in [
               'stop', 'shut up', 'be quiet', 'quiet', 'stop talking', 'stop it',
               "that's enough", 'that is enough', 'enough', 'leave me alone', 'no more'
             ] }}
        coaching_is_okay: >
          {{ coaching_norm is search("^(no )?(i'?m|i am) (doing )?(okay|ok|fine|alright|all right|good|all good|safe)( now)?$")
             or coaching_norm is search("^(no )?(all good|false alarm|never ?mind)$")
             or coaching_norm is search("^everything('?s| is) (okay|ok|fine|alright)$")
             or coaching_norm is search("^tell my family (i'?m|i am) (okay|ok|fine)$") }}
    - choose:
        - conditions: "{{ coaching_is_stop }}"
          sequence:
            - action: timer.start
              target:
                entity_id: timer.vivajot_coaching_mute
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "Okay."
                preannounce: false
        # "I'm okay" as the answer is the all-clear
        - conditions: "{{ coaching_is_okay }}"
          sequence:
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "okay"
                notify: true
                device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                details: "Asked 'Are you hurt?': {{ coaching_raw }}"
              response_variable: pub_ok
            - if:
                - condition: template
                  value_template: "{{ pub_ok is defined and pub_ok is mapping and pub_ok.get('published') == true }}"
              then:
                - action: timer.cancel
                  target:
                    entity_id: timer.vivajot_help_active
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "Okay, I've told your caregiver you're okay."
                    preannounce: false
              else:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I couldn't send that. Please use your phone."
                    preannounce: false
        - conditions: "{{ coaching_raw != '' }}"
          sequence:
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "help"
                device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                details: "Asked 'Are you hurt?': {{ coaching_raw }}"
              response_variable: pub_followup
            - if:
                - condition: template
                  value_template: "{{ pub_followup is defined and pub_followup is mapping and pub_followup.get('published') == true }}"
              then:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "Okay, I've sent that to your caregiver."
                    preannounce: false
              else:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I couldn't send that. Please use your phone."
                    preannounce: false
      default:
        - action: viva_renamer.voice_alert
          continue_on_error: true
          data:
            intent: "help"
            device_id: "{{ trigger.event.data.device_id | default('', true) }}"
            details: "No answer to 'Are you hurt?'"
