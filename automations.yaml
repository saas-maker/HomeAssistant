# ==============================================================================
# VIVAJOT FLEET AUTOMATIONS
# ==============================================================================

# --- ZHA WATCHDOG ---
# Two different failures, two different remedies:
#  1) Radio / serial port LOST (the Sept 18 2026 25-hour outage). ZHA's config
#     entry falls into setup-retry and its entities vanish, so
#     integration_entities('zha') is EMPTY (that is also why the old action
#     crashed with "invalid entity IDs"). Neither a core restart nor a ZHA reload
#     can reopen a dropped USB port — only a HOST reboot resets the USB bus.
#     Bounded to 3 reboots per incident by counter.vivajot_zha_reboots
#     (configuration.yaml) so a physically dead stick can never loop a hub.
#  2) Radio present but network HUNG: ZHA is loaded, yet every light has been
#     unavailable for 6 hours. Remedy is a ZHA reload, as before. 6 hours, NOT
#     less: consider_unavailable_mains is 15 s, so bulbs switched off at the
#     wall read as "unavailable" — an evening with all lights off is normal, and
#     the 3 AM restart resets the timer. Never tie a host reboot to this signal.
# Template triggers fire only on a false->true transition, so trigger 1 cannot
# catch a hub that BOOTS with a dead radio; the boot trigger covers that case
# (and resets the reboot budget after any boot where ZHA came up healthy).
# now() in the ZHA templates forces a re-check every minute — they reference no
# entity state, so nothing else would ever re-render them.
- id: "vivajot_zha_watchdog"
  alias: "VivaJot ZHA Watchdog"
  description: "Recovers a crashed Zigbee radio: ZHA reload for a hung network, bounded host reboots for a lost radio"
  mode: queued
  trigger:
    - trigger: template
      value_template: "{% set _ = now() %}{{ integration_entities('zha') | count == 0 }}"
      for: "00:15:00"
      id: "zha_down"
    - trigger: homeassistant
      event: start
      id: "boot"
    - trigger: template
      value_template: >
        {% set total = states.light | list | count %}
        {% set dead = states.light | selectattr('state', 'eq', 'unavailable') | list | count %}
        {{ total > 0 and dead == total }}
      for: "06:00:00"
      id: "lights_dead"
  action:
    - choose:
        # Hung network: reload ZHA (only meaningful while ZHA is actually loaded)
        - conditions: "{{ trigger.id == 'lights_dead' and integration_entities('zha') | count > 0 }}"
          sequence:
            - action: homeassistant.reload_config_entry
              target:
                entity_id: "{{ integration_entities('zha') | first }}"
        # 15 minutes after boot: ZHA healthy -> reset the budget; ZHA absent -> reboot (within budget)
        - conditions: "{{ trigger.id == 'boot' }}"
          sequence:
            - delay: "00:15:00"
            - if:
                - condition: template
                  value_template: "{{ integration_entities('zha') | count > 0 }}"
              then:
                - action: counter.reset
                  target:
                    entity_id: counter.vivajot_zha_reboots
              else:
                - condition: numeric_state
                  entity_id: counter.vivajot_zha_reboots
                  below: 3
                - action: counter.increment
                  target:
                    entity_id: counter.vivajot_zha_reboots
                - action: hassio.host_reboot
        # Radio lost while running: reboot the host (within budget)
        - conditions: "{{ trigger.id == 'zha_down' }}"
          sequence:
            - condition: numeric_state
              entity_id: counter.vivajot_zha_reboots
              below: 3
            - action: counter.increment
              target:
                entity_id: counter.vivajot_zha_reboots
            - action: hassio.host_reboot

# --- FLEET UPDATE (ON-BOOT) ---
# Pulls latest config 5 minutes after a system reboot.
# The nightly reboot automation handles the schedule — no separate time trigger needed.
- id: "vivajot_fleet_update"
  alias: "VivaJot Fleet Update"
  description: "Pulls latest configuration from central server on boot"
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    # ANTI-BOOT-LOOP SAFETY: Only allow updates if this automation hasn't run in the last 15 minutes.
    # The update cycle takes ~7 min (5 min delay + download + restart), so 15 min safely prevents loops
    # while still allowing manual reboots to pull updates promptly.
    - condition: template
      value_template: "{{ state_attr('automation.vivajot_fleet_update', 'last_triggered') == None or (as_timestamp(now()) - as_timestamp(state_attr('automation.vivajot_fleet_update', 'last_triggered'))) > 900 }}"
  action:
    # Wait 5 minutes after boot to ensure Wi-Fi and network are fully connected before downloading
    - delay: "00:05:00"
    - action: shell_command.update_hub
    # Guarantee a reboot even if the update script fails (e.g. internet is down).
    # If the update script already called 'ha core restart', this line is never reached.
    - action: homeassistant.restart

# --- NIGHTLY BACKUP ---
# Creates a local HA backup at 2:45 AM, 15 minutes before the nightly reboot.
# Guarantees every hub has a fresh restore point regardless of whether
# automatic backups were ever enabled in the UI.
# Uses the Supervisor integration's action, not the `ha` CLI: shell_command runs
# inside the Core container, where `ha` does not exist (every `ha ...` call in
# the logs returned 127 "command not found" — no nightly backup ever ran).
# Config-only ("homeassistant: true") keeps each backup to a few MB.
- id: "vivajot_nightly_backup"
  alias: "VivaJot Nightly Backup"
  description: "Creates a config-only backup before the nightly reboot"
  trigger:
    - trigger: time
      at: "02:45:00"
  action:
    - action: hassio.backup_partial
      data:
        name: "VivaJot-Nightly-{{ now().strftime('%Y%m%d') }}"
        homeassistant: true
        compressed: true

# --- NIGHTLY REBOOT ---
# Full HA restart at 3 AM to keep the Zigbee radio healthy.
# This also triggers the fleet update via the boot trigger above.
- id: "vivajot_nightly_reboot"
  alias: "VivaJot Nightly Reboot"
  description: "Restarts Home Assistant nightly to maintain Zigbee stability"
  trigger:
    - trigger: time
      at: "03:00:00"
  action:
    - action: homeassistant.restart

# --- PLUG KEEP-ALIVE ---
# Smart plugs must always stay ON — they are passthrough power monitors.
# Users control appliances physically; the plug just measures wattage spikes.
# Two triggers handle both scenarios:
#   1) Mid-day: only the plug lost power, hub stayed on → template detects it within seconds
#   2) Full outage: hub also rebooted → boot trigger turns on all plugs after ZHA initializes
- id: "vivajot_plug_keepalive"
  alias: "VivaJot Plug Keep-Alive"
  description: "Re-enables smart plugs after power loss"
  mode: restart
  trigger:
    - trigger: template
      value_template: >
        {{ states.switch
           | selectattr('entity_id', 'in', integration_entities('zha'))
           | selectattr('state', 'eq', 'off')
           | list | count > 0 }}
      id: "plugs_off"
    - trigger: homeassistant
      event: start
      id: "full_boot"
  action:
    - delay: "{{ '00:00:10' if trigger.id == 'plugs_off' else '00:02:00' }}"
    - action: switch.turn_on
      target:
        entity_id: >
          {{ states.switch
             | selectattr('entity_id', 'in', integration_entities('zha'))
             | selectattr('state', 'eq', 'off')
             | map(attribute='entity_id') | list }}

# --- VOICE SPEAKER: EMERGENCY HELP & ACTIVE FALL COACHING (STEPS 1, 2, 3) ---
# Triggers when resident says "I need help", "Help help", "I fell", etc. to HA Voice PE.
# 1) Immediately sends high-priority Risk 99 alert + push notification to family/caregivers
# 2) Speaks immediate reassurance ("Help is on the way, please stay still")
# 3) Conducts interactive follow-up check-in ("Are you hurt or in pain?") and sends a
#    second coaching update push notification with the resident's answer, followed by
#    a 30-second calming reminder.
- id: "vivajot_voice_help"
  alias: "VivaJot Voice - Help & Fall Coaching"
  description: "Handles emergency voice phrases, alerts family immediately, and coaches the resident"
  mode: restart
  trigger:
    - trigger: conversation
      command:
        - "help"
        - "help help"
        - "help me"
        - "help me please"
        - "please help"
        - "please help me"
        - "i need help"
        - "i need some help"
        - "somebody help"
        - "somebody help me"
        - "i fell"
        - "i fell down"
        - "i have fallen"
        - "i've fallen"
        - "i just fell"
        - "i cannot get up"
        - "i can't get up"
        - "i am hurt"
        - "i'm hurt"
        - "i hurt myself"
        - "call my family"
        - "call for help"
        - "can you help me"
        - "call 911"
        - "get help"
        - "emergency"
  action:
    # No alert yet: confirm first (resident's explicit request, 2026-10-22).
    # Starting the cooldown here marks the incident as "being handled" so the
    # wake-word safety net below stays quiet while the confirmation runs.
    - set_conversation_response: ""
    - action: timer.start
      target:
        entity_id: timer.vivajot_alert_cooldown
    - event: vivajot_confirm_help
      event_data:
        device_id: "{{ trigger.device_id | default('', true) }}"
        heard: "{{ trigger.sentence | default('I need help', true) }}"

# --- VOICE SPEAKER: HELP CONFIRMATION (asks before alerting) ---
# "Do you need help?" - explicit "no" cancels quietly; "yes", anything
# unclear, or SILENCE alerts (fail-safe: an unconscious resident still
# gets help). Runs in the background so the conversation trigger returns
# immediately.
- id: "vivajot_voice_help_confirm"
  alias: "VivaJot Voice - Help Confirmation"
  description: "Confirms a help request before alerting; silence or yes alerts, only a clear no cancels"
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: event
      event_type: vivajot_confirm_help
  variables:
    sat_entity: >
      {% set dev = trigger.event.data.device_id | default('', true) %}
      {% set dev_sats = device_entities(dev) | select('match', '^assist_satellite\.') | list if dev else [] %}
      {{ dev_sats[0] if dev_sats | count > 0 else (states.assist_satellite | map(attribute='entity_id') | first | default('', true)) }}
  condition:
    - condition: template
      value_template: "{{ sat_entity != '' }}"
  action:
    - delay: "00:00:01"
    - action: assist_satellite.ask_question
      continue_on_error: true
      target:
        entity_id: "{{ sat_entity }}"
      data:
        question: "Do you need help? Please say yes or no."
        preannounce: false
        answers:
          - id: "confirm_no"
            sentences:
              - "no"
              - "nope"
              - "no thank you"
              - "no i don't"
              - "i'm ok"
              - "i am ok"
              - "i'm okay"
              - "i am okay"
              - "i'm fine"
              - "i am fine"
              - "i'm safe"
              - "i am safe"
              - "i'm alright"
              - "i am alright"
              - "all good"
              - "false alarm"
              - "cancel"
              - "cancel that"
              - "never mind"
              - "nevermind"
              - "i don't need help"
              - "i do not need help"
              - "no help"
              - "don't call for help"
              - "do not call for help"
              - "don't call anyone"
              - "do not call anyone"
              - "don't send help"
              - "do not send help"
              - "don't call my family"
              - "do not call my family"
          - id: "confirm_yes"
            sentences:
              - "yes"
              - "yeah"
              - "yep"
              - "yes please"
              - "help"
              - "help me"
              - "help help"
              - "i need help"
              - "please help me"
              - "i fell"
              - "i fell down"
              - "i can't get up"
              - "i cannot get up"
              - "i'm hurt"
              - "i am hurt"
              - "it hurts"
              - "send help"
              - "call my family"
              - "hurry"
      response_variable: confirm_answer
    - variables:
        # Catch the whole class of natural cancellations, not an enumerated
        # list: negation/okay words with no danger words means "no".
        heard_sentence: "{{ confirm_answer.sentence | default('', true) if confirm_answer is defined else '' }}"
        sounds_like_cancel: >
          {{ heard_sentence != ''
             and heard_sentence | regex_search("(?i)\b(no|not|don'?t|never ?mind|nevermind|ok|okay|fine|alright|safe)\b")
             and not heard_sentence | regex_search("(?i)\b(yes|yeah|fell|fall|fallen|hurt|hurts|pain|hurry|can'?t)\b") }}
    - choose:
        - conditions: "{{ (confirm_answer is defined and confirm_answer.id is defined and confirm_answer.id == 'confirm_no') or sounds_like_cancel }}"
          sequence:
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "Okay, no alert sent. Say Help Help any time you need me."
                preannounce: false
      # yes, ambiguous, unintelligible, or silence: alert. Fail-safe by design.
      default:
        - action: viva_renamer.voice_alert
          data:
            intent: "help"
            device_id: "{{ trigger.event.data.device_id | default('', true) }}"
            details: "Urgent Voice Alert: Resident said {{ trigger.event.data.heard | default('I need help', true) }} to the VivaJot Smart Speaker{{ '' if confirm_answer is defined and confirm_answer.id is defined else ' and did not answer the confirmation' }}. Immediate check-in recommended."
        - action: assist_satellite.announce
          continue_on_error: true
          target:
            entity_id: "{{ sat_entity }}"
          data:
            message: "Help is on the way. I have notified your family and caregiver right now. Please stay still and do not try to stand up."
            preannounce: false
        - event: vivajot_start_fall_coaching
          event_data:
            device_id: "{{ trigger.event.data.device_id | default('', true) }}"

# Runs in the background after the help confirmation finishes speaking,
# so the conversation trigger returns immediately instead of blocking on delays/ask_question.
- id: "vivajot_voice_fall_coaching"
  alias: "VivaJot Voice - Active Fall Coaching Follow-Up"
  description: "Conducts interactive follow-up check-in after initial emergency voice response finishes speaking"
  # single+silent: a resident re-triggering mid-check-in must not cancel the
  # question in progress or start a second overlapping coaching session.
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: event
      event_type: vivajot_start_fall_coaching
  variables:
    sat_entity: >
      {% set dev = trigger.event.data.device_id | default('', true) %}
      {% set dev_sats = device_entities(dev) | select('match', '^assist_satellite\.') | list if dev else [] %}
      {{ dev_sats[0] if dev_sats | count > 0 else (states.assist_satellite | map(attribute='entity_id') | first | default('', true)) }}
  condition:
    - condition: template
      value_template: "{{ sat_entity != '' }}"
  action:
    - delay: "00:00:12"
    - action: assist_satellite.ask_question
      continue_on_error: true
      target:
        entity_id: "{{ sat_entity }}"
      data:
        question: "Are you hurt or in pain? Please say yes or no."
        preannounce: false
        answers:
          - id: "hurt_yes"
            sentences:
              - "yes"
              - "yeah"
              - "yep"
              - "yes i am"
              - "i am hurt"
              - "i'm hurt"
              - "i am in pain"
              - "i'm in pain"
              - "it hurts"
              - "my [body_part] hurts"
              - "help"
              - "help me"
          - id: "hurt_no"
            sentences:
              - "no"
              - "nope"
              - "no i am not"
              - "no i'm not"
              - "i am okay"
              - "i'm okay"
              - "i am fine"
              - "i'm fine"
              - "i am safe"
              - "i'm safe"
              - "i am alright"
              - "i'm alright"
              - "all good"
              - "not hurt"
              - "no pain"
      response_variable: coaching_answer
    - choose:
        - conditions: "{{ coaching_answer is defined and coaching_answer.id is defined and coaching_answer.id == 'hurt_yes' }}"
          sequence:
            - action: viva_renamer.voice_alert
              data:
                intent: "help"
                device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                details: "Help follow-up: Resident reported they ARE HURT or in pain ({{ coaching_answer.sentence }}). Please respond immediately."
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "I have updated your family that you are in pain so they can hurry. Please stay completely still and take slow breaths."
                preannounce: false
        - conditions: "{{ coaching_answer is defined and coaching_answer.id is defined and coaching_answer.id == 'hurt_no' }}"
          sequence:
            - action: viva_renamer.voice_alert
              data:
                intent: "help"
                device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                details: "Help follow-up: Resident confirmed they are awake and not in pain ({{ coaching_answer.sentence }}), waiting safely for assistance."
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "Thank you. I have let your family know you are not in pain and are waiting safely. Please rest comfortably until they arrive."
                preannounce: false
      default:
        - if:
            - condition: template
              value_template: "{{ coaching_answer is defined and coaching_answer.sentence is defined and coaching_answer.sentence != none and coaching_answer.sentence != '' }}"
          then:
            - action: viva_renamer.voice_alert
              data:
                intent: "help"
                device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                details: "Help follow-up: Resident replied {{ coaching_answer.sentence }}."
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "Thank you. I have shared your message with your family. Please stay still while help is on the way."
                preannounce: false
          else:
            - action: viva_renamer.voice_alert
              data:
                intent: "help"
                device_id: "{{ trigger.event.data.device_id | default('', true) }}"
                details: "Help follow-up: No verbal response from resident after initial help request. Please check on them urgently."
    # 30-second calming coaching reminder
    - delay: "00:00:30"
    - action: assist_satellite.announce
      continue_on_error: true
      target:
        entity_id: "{{ sat_entity }}"
      data:
        message: "Reminder: Your caregiver has been notified and help is on the way. Please stay calm and rest comfortably."
        preannounce: false

# --- VOICE SPEAKER: HELP ALERT ON WAKE WORD (STT-INDEPENDENT SAFETY NET) ---
# The speaker reports every wake word as an esphome.vivajot_wake_word event
# (firmware 26.10.22.4+). A help wake word IS the emergency: the Risk-99 alert
# fires here even when the speech-to-text pipeline is down (observed failing
# 2026-10-22), so no transcription is ever required to summon help. If STT is
# healthy, the conversation automation above handles the spoken reassurance;
# this one only speaks if that path stayed silent.
- id: "vivajot_voice_help_wake_event"
  alias: "VivaJot Voice - Help Alert on Wake Word"
  description: "Fires the help alert from the wake word itself, independent of speech-to-text"
  mode: single
  max_exceeded: silent
  trigger:
    - trigger: event
      event_type: esphome.vivajot_wake_word
  condition:
    - condition: template
      value_template: "{{ 'help' in (trigger.event.data.wake_word | default('') | lower) }}"
  variables:
    speaker_name: "{{ trigger.event.data.device_name | default('', true) }}"
    sat_entity: >
      {% set sats = states.assist_satellite | map(attribute='entity_id') | list %}
      {% set match = sats | select('search', speaker_name | replace('-', '_')) | list %}
      {{ match[0] if match | count > 0 else (sats | first | default('', true)) }}
  action:
    # Give the normal STT path 12 seconds to start the confirmation flow
    # (which marks the cooldown). If nothing claimed the incident by then,
    # STT is down: alert unconditionally - no transcription required.
    - delay: "00:00:12"
    - if:
        - condition: state
          entity_id: timer.vivajot_alert_cooldown
          state: idle
      then:
        - action: timer.start
          target:
            entity_id: timer.vivajot_alert_cooldown
        - action: viva_renamer.voice_alert
          data:
            intent: "help"
            device_id: ""
            details: "Urgent Voice Alert: Resident woke the VivaJot Smart Speaker ({{ speaker_name }}) with '{{ trigger.event.data.wake_word }}' and speech processing was unavailable. Immediate check-in recommended."
        - action: assist_satellite.announce
          continue_on_error: true
          target:
            entity_id: "{{ sat_entity }}"
          data:
            message: "Help is on the way. I have notified your family and caregiver right now. Please stay still and do not try to stand up."
            preannounce: false
        - event: vivajot_start_fall_coaching
          event_data:
            device_id: ""

# --- VOICE SPEAKER: ALL CLEAR / I AM OKAY (STEP 1) ---
# Triggers when resident says "I am okay" or "I'm fine" to send a reassuring All Clear (Risk 0)
# push notification and clear any active alert banner on the VivaJot dashboard.
- id: "vivajot_voice_okay"
  alias: "VivaJot Voice - I Am Okay"
  description: "Lets resident send an All Clear check-in to family via voice"
  mode: restart
  trigger:
    - trigger: conversation
      command:
        - "i am okay"
        - "i'm okay"
        - "i am ok"
        - "i'm ok"
        - "i am fine"
        - "i'm fine"
        - "i am alright"
        - "i'm alright"
        - "i am doing okay"
        - "i'm doing okay"
        - "everything is okay"
        - "everything is fine"
        - "tell my family i am okay"
        - "tell my family i'm okay"
        - "i am safe"
        - "i'm safe"
        - "all good"
        - "false alarm"
  action:
    # Saying you're okay resolves any in-flight incident: mark the cooldown
    # so stale help flows stay quiet.
    - action: timer.start
      target:
        entity_id: timer.vivajot_alert_cooldown
    - set_conversation_response: "Great. I have let your family know that you are okay."
    - action: viva_renamer.voice_alert
      data:
        intent: "okay"
        device_id: "{{ trigger.device_id | default('', true) }}"
        details: "Voice Check-In: Resident reported 'I am okay' via the VivaJot Smart Speaker."
