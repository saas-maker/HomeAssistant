# ==============================================================================
# VIVAJOT FLEET AUTOMATIONS
# ==============================================================================

# --- ZHA WATCHDOG ---
# Two different failures, two different remedies:
#  1) Radio / serial port LOST (the Sept 18 2026 25-hour outage). ZHA's config
#     entry falls into setup-retry and its entities vanish, so
#     integration_entities('zha') is EMPTY (that is also why the old action
#     crashed with "invalid entity IDs"). Neither a core restart nor a ZHA reload
#     can reopen a dropped USB port — only a HOST reboot resets the USB bus.
#     Bounded to 3 reboots per incident by counter.vivajot_zha_reboots
#     (configuration.yaml) so a physically dead stick can never loop a hub.
#  2) Radio present but network HUNG: ZHA is loaded, yet every light has been
#     unavailable for 6 hours. Remedy is a ZHA reload, as before. 6 hours, NOT
#     less: consider_unavailable_mains is 15 s, so bulbs switched off at the
#     wall read as "unavailable" — an evening with all lights off is normal, and
#     the 3 AM restart resets the timer. Never tie a host reboot to this signal.
# Template triggers fire only on a false->true transition, so trigger 1 cannot
# catch a hub that BOOTS with a dead radio; the boot trigger covers that case
# (and resets the reboot budget after any boot where ZHA came up healthy).
# now() in the ZHA templates forces a re-check every minute — they reference no
# entity state, so nothing else would ever re-render them.
- id: "vivajot_zha_watchdog"
  alias: "VivaJot ZHA Watchdog"
  description: "Recovers a crashed Zigbee radio: ZHA reload for a hung network, bounded host reboots for a lost radio"
  mode: queued
  trigger:
    - trigger: template
      value_template: "{% set _ = now() %}{{ integration_entities('zha') | count == 0 }}"
      for: "00:15:00"
      id: "zha_down"
    - trigger: homeassistant
      event: start
      id: "boot"
    - trigger: template
      value_template: >
        {% set total = states.light | list | count %}
        {% set dead = states.light | selectattr('state', 'eq', 'unavailable') | list | count %}
        {{ total > 0 and dead == total }}
      for: "06:00:00"
      id: "lights_dead"
  action:
    - choose:
        # Hung network: reload ZHA (only meaningful while ZHA is actually loaded)
        - conditions: "{{ trigger.id == 'lights_dead' and integration_entities('zha') | count > 0 }}"
          sequence:
            - action: homeassistant.reload_config_entry
              target:
                entity_id: "{{ integration_entities('zha') | first }}"
        # 15 minutes after boot: ZHA healthy -> reset the budget; ZHA absent -> reboot (within budget)
        - conditions: "{{ trigger.id == 'boot' }}"
          sequence:
            - delay: "00:15:00"
            - if:
                - condition: template
                  value_template: "{{ integration_entities('zha') | count > 0 }}"
              then:
                - action: counter.reset
                  target:
                    entity_id: counter.vivajot_zha_reboots
              else:
                - condition: numeric_state
                  entity_id: counter.vivajot_zha_reboots
                  below: 3
                - action: counter.increment
                  target:
                    entity_id: counter.vivajot_zha_reboots
                - action: hassio.host_reboot
        # Radio lost while running: reboot the host (within budget)
        - conditions: "{{ trigger.id == 'zha_down' }}"
          sequence:
            - condition: numeric_state
              entity_id: counter.vivajot_zha_reboots
              below: 3
            - action: counter.increment
              target:
                entity_id: counter.vivajot_zha_reboots
            - action: hassio.host_reboot

# --- FLEET UPDATE (ON-BOOT) ---
# Pulls latest config 5 minutes after a system reboot.
# The nightly reboot automation handles the schedule — no separate time trigger needed.
- id: "vivajot_fleet_update"
  alias: "VivaJot Fleet Update"
  description: "Pulls latest configuration from central server on boot"
  trigger:
    - trigger: homeassistant
      event: start
  condition:
    # ANTI-BOOT-LOOP SAFETY: Only allow updates if this automation hasn't run in the last 15 minutes.
    # The update cycle takes ~7 min (5 min delay + download + restart), so 15 min safely prevents loops
    # while still allowing manual reboots to pull updates promptly.
    - condition: template
      value_template: "{{ state_attr('automation.vivajot_fleet_update', 'last_triggered') == None or (as_timestamp(now()) - as_timestamp(state_attr('automation.vivajot_fleet_update', 'last_triggered'))) > 900 }}"
  action:
    # Wait 5 minutes after boot to ensure Wi-Fi and network are fully connected before downloading
    - delay: "00:05:00"
    - action: shell_command.update_hub
    # Guarantee a reboot even if the update script fails (e.g. internet is down).
    # If the update script already called 'ha core restart', this line is never reached.
    - action: homeassistant.restart

# --- NIGHTLY BACKUP ---
# Creates a local HA backup at 2:45 AM, 15 minutes before the nightly reboot.
# Guarantees every hub has a fresh restore point regardless of whether
# automatic backups were ever enabled in the UI.
# Uses the Supervisor integration's action, not the `ha` CLI: shell_command runs
# inside the Core container, where `ha` does not exist (every `ha ...` call in
# the logs returned 127 "command not found" — no nightly backup ever ran).
# Config-only ("homeassistant: true") keeps each backup to a few MB.
- id: "vivajot_nightly_backup"
  alias: "VivaJot Nightly Backup"
  description: "Creates a config-only backup before the nightly reboot"
  trigger:
    - trigger: time
      at: "02:45:00"
  action:
    - action: hassio.backup_partial
      data:
        name: "VivaJot-Nightly-{{ now().strftime('%Y%m%d') }}"
        homeassistant: true
        compressed: true

# --- NIGHTLY REBOOT ---
# Full HA restart at 3 AM to keep the Zigbee radio healthy.
# This also triggers the fleet update via the boot trigger above.
- id: "vivajot_nightly_reboot"
  alias: "VivaJot Nightly Reboot"
  description: "Restarts Home Assistant nightly to maintain Zigbee stability"
  trigger:
    - trigger: time
      at: "03:00:00"
  action:
    - action: homeassistant.restart

# --- PLUG KEEP-ALIVE ---
# Smart plugs must always stay ON — they are passthrough power monitors.
# Users control appliances physically; the plug just measures wattage spikes.
# Two triggers handle both scenarios:
#   1) Mid-day: only the plug lost power, hub stayed on → template detects it within seconds
#   2) Full outage: hub also rebooted → boot trigger turns on all plugs after ZHA initializes
- id: "vivajot_plug_keepalive"
  alias: "VivaJot Plug Keep-Alive"
  description: "Re-enables smart plugs after power loss"
  mode: restart
  trigger:
    - trigger: template
      value_template: >
        {{ states.switch
           | selectattr('entity_id', 'in', integration_entities('zha'))
           | selectattr('state', 'eq', 'off')
           | list | count > 0 }}
      id: "plugs_off"
    - trigger: homeassistant
      event: start
      id: "full_boot"
  action:
    - delay: "{{ '00:00:10' if trigger.id == 'plugs_off' else '00:02:00' }}"
    - action: switch.turn_on
      target:
        entity_id: >
          {{ states.switch
             | selectattr('entity_id', 'in', integration_entities('zha'))
             | selectattr('state', 'eq', 'off')
             | map(attribute='entity_id') | list }}

# --- VOICE SPEAKER: CATCH-ALL CONVERSATION HANDLER (safety net) ---
# Firmware 26.10.28.1+ no longer listens for a command after "VivaJot"; the hub
# asks "Do you need help?" straight away (see the wake handler below). This
# handler only runs on older firmware, or if speech still reaches the pipeline.
# Three outcomes: stop, the all-clear ("I'm okay" class), or the question.
# Nothing a resident says is ever forwarded in the background or dropped.
- id: "vivajot_voice_conversation"
  alias: "VivaJot Voice - Conversation Handler"
  description: "Routes any post-wake speech to stop, the all-clear, or the help question"
  mode: restart
  trigger:
    - trigger: conversation
      command:
        - "{utterance}"
  variables:
    utterance_raw: "{{ (trigger.sentence | default(trigger.slots.utterance | default('', true), true) | string).strip() }}"
    utterance_norm: >
      {{ utterance_raw | lower
         | regex_replace("[^a-z0-9' ]", " ")
         | regex_replace("\\s+", " ")
         | trim
         | regex_replace("^viva ?jot ", "") }}
    is_stop: >
      {{ utterance_norm in [
           'stop', 'shut up', 'be quiet', 'quiet', 'stop talking', 'stop it',
           "that's enough", 'that is enough', 'enough', 'leave me alone', 'no more'
         ] }}
    # The okay class, one definition used everywhere: a statement that they are
    # okay. A bare "okay" or "no" is NOT in it (ambiguous).
    is_okay: >
      {{ utterance_norm is search("^(no )?(i'?m|i am) (doing |feeling )?(okay|ok|fine|alright|all right|good|all good|safe|better)( now)?$")
         or utterance_norm is search("^(no )?(all good|false alarm|never ?mind|forget it|i'?m good)$")
         or utterance_norm is search("^everything('?s| is) (okay|ok|fine|alright)$")
         or utterance_norm is search("^tell my family (i'?m|i am) (okay|ok|fine)$") }}
    help_active: "{{ is_state('timer.vivajot_help_active', 'active') }}"
  action:
    - choose:
        # Stop means be quiet, anywhere, any time. Never cancels an alert.
        - conditions: "{{ is_stop }}"
          sequence:
            - set_conversation_response: "Okay."

        # The all-clear. While an alert is active the family is told (notify);
        # otherwise the cloud still clears any open alert it finds.
        - conditions: "{{ is_okay }}"
          sequence:
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "okay"
                notify: "{{ help_active }}"
                device_id: "{{ trigger.device_id | default('', true) }}"
                details: "{{ utterance_raw }}"
              response_variable: pub_okay
            - if:
                - condition: template
                  value_template: "{{ pub_okay is defined and pub_okay is mapping and pub_okay.get('published') == true }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ help_active }}"
                  then:
                    - action: timer.cancel
                      target:
                        entity_id: timer.vivajot_help_active
                    - set_conversation_response: "Okay, I've told your caregiver you're okay."
                  else:
                    - set_conversation_response: "Okay."
              else:
                - set_conversation_response: "I couldn't send that. Please use your phone."

      # Anything else ("I fell", "what time is it", a mumble) -> the question.
      # The words heard are kept and sent with the alert if they say yes.
      default:
        - set_conversation_response: ""
        - event: vivajot_confirm_help
          event_data:
            device_id: "{{ trigger.device_id | default('', true) }}"
            heard: "{{ utterance_raw }}"

# --- VOICE SPEAKER: WAKE WORD HANDLER ---
# Every "VivaJot" wake is logged with the word that fired, then the question is
# asked. Firmware 26.10.28.1+ sends ask: true and does not start its own listen,
# so the question comes straight after the chime. Older firmware listens for a
# command first; then the hub waits for the speaker to go idle and asks only if
# the conversation handler did not already take the speech.
- id: "vivajot_voice_wake_event"
  alias: "VivaJot Voice - Wake Word Handler"
  description: "Logs the wake word and asks whether the resident needs help"
  mode: restart
  trigger:
    - trigger: event
      event_type: esphome.vivajot_wake_word
  variables:
    speaker_name: "{{ trigger.event.data.device_name | default('', true) }}"
    ask_now: "{{ trigger.event.data.ask | default(false, true) | bool }}"
    sat_entity: >
      {% set sats = states.assist_satellite | map(attribute='entity_id') | list %}
      {% set match = sats | select('search', speaker_name | replace('-', '_')) | list %}
      {{ match[0] if match | count > 0 else (sats | first | default('', true)) }}
    resolved_device_id: "{{ device_id(sat_entity) | default('', true) if sat_entity != '' else '' }}"
    conv_last_triggered: "{{ state_attr('automation.vivajot_voice_conversation', 'last_triggered') | string }}"
    confirm_last_triggered: "{{ state_attr('automation.vivajot_voice_help_confirm', 'last_triggered') | string }}"
  condition:
    - condition: template
      value_template: "{{ sat_entity != '' }}"
  action:
    # Record every wake with the word that fired, so false wakes can be counted per word in the Logbook
    - action: logbook.log
      continue_on_error: true
      data:
        name: "VivaJot wake"
        message: "{{ trigger.event.data.wake_word | default('?', true) }} on {{ speaker_name }}"
        entity_id: "{{ sat_entity }}"
    - if:
        - condition: template
          value_template: "{{ not ask_now }}"
      then:
        # Older firmware: let its own listen finish first
        - wait_template: "{{ states(sat_entity) != 'idle' }}"
          timeout: "00:00:02"
        - wait_template: "{{ states(sat_entity) == 'idle' }}"
          timeout: "00:00:15"
        - delay: "00:00:00.500"
        - condition: template
          value_template: >
            {{ (state_attr('automation.vivajot_voice_conversation', 'last_triggered') | string) == conv_last_triggered
               and (state_attr('automation.vivajot_voice_help_confirm', 'last_triggered') | string) == confirm_last_triggered
               and (state_attr('automation.vivajot_voice_help_confirm', 'current') | int(0)) == 0 }}
    - event: vivajot_confirm_help
      event_data:
        device_id: "{{ resolved_device_id }}"
        heard: ""

# --- VOICE SPEAKER: THE QUESTION ---
# One yes/no question, asked once more if unclear. Nothing is sent without a yes.
# No alert active:  "Do you need help? Yes or no."
#    yes -> alert -> "I've notified your caregiver. Stay where you are."
#    no  -> "Okay."     stop -> silent     unclear twice -> silent, nothing sent
# Alert active:     "Your caregiver has already been notified. Do you still need help? Yes or no."
#    no  -> all-clear -> "Okay, I've told your caregiver you're okay."
#    yes -> "Tell me what's wrong." -> their words go to the caregiver
#           -> "Okay, I've sent that to your caregiver."
# Every spoken line is only said after the send actually succeeded.
- id: "vivajot_voice_help_confirm"
  alias: "VivaJot Voice - Help Confirmation"
  description: "Asks the yes/no help question, re-asks once if unclear, alerts only on yes"
  mode: restart
  trigger:
    - trigger: event
      event_type: vivajot_confirm_help
  variables:
    sat_entity: >
      {% set dev = trigger.event.data.device_id | default('', true) %}
      {% set dev_sats = device_entities(dev) | select('match', '^assist_satellite\.') | list if dev else [] %}
      {{ dev_sats[0] if dev_sats | count > 0 else (states.assist_satellite | map(attribute='entity_id') | first | default('', true)) }}
    device_id_in: "{{ trigger.event.data.device_id | default('', true) }}"
    initial_heard: "{{ (trigger.event.data.heard | default('', true) | string).strip() }}"
    help_active: "{{ is_state('timer.vivajot_help_active', 'active') }}"
    question_1: >
      {{ 'Your caregiver has already been notified. Do you still need help? Yes or no.'
         if help_active else 'Do you need help? Yes or no.' }}
    # Short on purpose: a second long sentence sounds like rambling.
    question_2: "Sorry, I didn't catch that. Yes or no?"
    # Answer lists (sentence-template syntax: [optional], (a|b), {wildcard}).
    # YES is deliberately short (Cary, 2026-10-28): the question says "yes or no", so "yes"
    # and "help" carry nearly every real answer, plus "yeah"/"yep" because speech-to-text often
    # writes a soft "yes" that way and the distress phrases a person in trouble says instead.
    # No wildcards, no "sure"/"please"/"uh huh": a TV playing during a false wake says those
    # constantly. Anything else is not an answer and gets "Sorry, I didn't catch that. Yes or no?"
    # (one extra question, never a missed alert). NO can stay long: a false no costs nothing
    # while no alert is active. A bare "okay" is NOT an answer (ambiguous).
    yes_answers:
      - "yes"
      - "yeah"
      - "yep"
      - "yes please"
      - "yeah please"
      - "yes i do"
      - "help"
      - "help me"
      - "help me please"
      - "please help"
      - "please help me"
      - "somebody help"
      - "send help"
      - "i need help"
      - "i need some help"
      - "yes i need help"
      - "no i need help"
      - "i fell"
      - "i fell down"
      - "i have fallen"
      - "i've fallen"
      - "no i fell"
      - "no i fell down"
      - "i can't get up"
      - "i cannot get up"
      - "no i can't get up"
    no_answers:
      - "no"
      - "nope"
      - "nah"
      - "no thanks"
      - "no thank you"
      - "no i don't"
      - "no i do not"
      - "no i'm not"
      - "not now"
      - "no help"
      - "no need"
      - "i don't need help"
      - "i do not need help"
      - "i don't need any help"
      - "i don't need anything"
      - "i'm just testing"
      - "just testing"
      - "testing"
      - "cancel"
      - "cancel that"
      - "cancel the request"
      - "that's okay"
      - "that's fine"
      - "it's okay"
      - "it's fine"
      - "[no] (i'm|i am) [doing|feeling] (okay|ok|fine|alright|all right|good|all good|safe|better) [now]"
      - "[no] (all good|false alarm|never mind|nevermind|forget it|i'm good)"
      - "everything is (okay|ok|fine|alright)"
      - "everything's (okay|ok|fine|alright)"
      - "no (i'm|i am) (okay|ok|fine|alright|good) [thank you|thanks]"
    stop_answers:
      - "stop"
      - "[vivajot] stop"
      - "shut up"
      - "be quiet"
      - "quiet"
      - "stop talking"
      - "stop it"
      - "that's enough"
      - "that is enough"
      - "enough"
      - "leave me alone"
      - "no more"
  condition:
    - condition: template
      value_template: "{{ sat_entity != '' }}"
  action:
    # Wait for the wake chime (0.95 s) to finish. If the question arrives while the chime
    # is still playing, the speaker never sees its player switch to "announcing", falls back
    # to a 2-second timer, and opens the mic mid-question: it then hears its own voice as the
    # answer (live log 2026-10-28: "I've been notified"). An idle player avoids that.
    - delay: "00:00:01.500"
    - action: assist_satellite.ask_question
      continue_on_error: true
      target:
        entity_id: "{{ sat_entity }}"
      data:
        question: "{{ question_1 }}"
        preannounce: false
        answers:
          - id: "yes"
            sentences: "{{ yes_answers }}"
          - id: "no"
            sentences: "{{ no_answers }}"
          - id: "stop"
            sentences: "{{ stop_answers }}"
      response_variable: ans1
    - variables:
        id1: "{{ (ans1.id | default('', true)) if ans1 is defined and ans1 is mapping else '' }}"
        raw1: "{{ (ans1.sentence | default('', true) | string).strip() if ans1 is defined and ans1 is mapping else '' }}"
        clear1: "{{ id1 in ['yes', 'no', 'stop'] }}"
        # Words were heard but were not yes/no/stop. Silence (or noise) returns no answer at all.
        heard1: "{{ ans1 is defined and ans1 is mapping }}"
    # Heard words that were not an answer: ask once more. Silence is the normal false wake
    # in an empty room, so it is NOT asked twice (a speaker that nags an empty room gets unplugged).
    - if:
        - condition: template
          value_template: "{{ heard1 and not clear1 }}"
      then:
        - action: assist_satellite.ask_question
          continue_on_error: true
          target:
            entity_id: "{{ sat_entity }}"
          data:
            question: "{{ question_2 }}"
            preannounce: false
            answers:
              - id: "yes"
                sentences: "{{ yes_answers }}"
              - id: "no"
                sentences: "{{ no_answers }}"
              - id: "stop"
                sentences: "{{ stop_answers }}"
          response_variable: ans2
        - variables:
            id2: "{{ (ans2.id | default('', true)) if ans2 is defined and ans2 is mapping else '' }}"
            raw2: "{{ (ans2.sentence | default('', true) | string).strip() if ans2 is defined and ans2 is mapping else '' }}"
            final_id: "{{ id2 }}"
            final_raw: "{{ raw2 }}"
      else:
        - variables:
            final_id: "{{ id1 }}"
            final_raw: "{{ raw1 }}"
    - choose:
        # Stop: be quiet. Nothing else happens.
        - conditions: "{{ final_id == 'stop' }}"
          sequence: []

        # ----- No alert active -----
        - conditions: "{{ not help_active and final_id == 'no' }}"
          sequence:
            - action: assist_satellite.announce
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                message: "Okay."
                preannounce: false

        - conditions: "{{ not help_active and final_id == 'yes' }}"
          sequence:
            - variables:
                alert_words: >
                  {{ initial_heard ~ ' (' ~ final_raw ~ ')'
                     if initial_heard != '' and final_raw != '' and (initial_heard | lower) != (final_raw | lower)
                     else (initial_heard if initial_heard != '' else (final_raw if final_raw != '' else 'yes')) }}
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "help"
                device_id: "{{ device_id_in }}"
                details: "{{ alert_words }}"
              response_variable: pub_help
            - if:
                - condition: template
                  value_template: "{{ pub_help is defined and pub_help is mapping and pub_help.get('published') == true }}"
              then:
                - action: timer.start
                  target:
                    entity_id: timer.vivajot_help_active
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I've notified your caregiver. Stay where you are."
                    preannounce: false
              else:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I couldn't send the alert. Please use your phone."
                    preannounce: false

        # ----- Alert already active -----
        # No / I'm okay: the all-clear. The caregiver is told they are okay.
        - conditions: "{{ help_active and final_id == 'no' }}"
          sequence:
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "okay"
                notify: true
                device_id: "{{ device_id_in }}"
                details: "{{ final_raw if final_raw != '' else 'no' }}"
              response_variable: pub_okay
            - if:
                - condition: template
                  value_template: "{{ pub_okay is defined and pub_okay is mapping and pub_okay.get('published') == true }}"
              then:
                - action: timer.cancel
                  target:
                    entity_id: timer.vivajot_help_active
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "Okay, I've told your caregiver you're okay."
                    preannounce: false
              else:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I couldn't send that. Please use your phone."
                    preannounce: false

        # Yes, still needs help: take their words and send them to the caregiver.
        - conditions: "{{ help_active and final_id == 'yes' }}"
          sequence:
            - action: assist_satellite.ask_question
              continue_on_error: true
              target:
                entity_id: "{{ sat_entity }}"
              data:
                question: "Tell me what's wrong."
                preannounce: false
                answers:
                  - id: "said"
                    sentences:
                      - "{reply}"
              response_variable: more
            - variables:
                more_raw: >
                  {{ (more.sentence | default('', true) | string).strip()
                     if more is defined and more is mapping and more.sentence is not none else '' }}
                more_words: >
                  {{ more_raw if more_raw != '' else ('Still needs help: ' ~ (final_raw if final_raw != '' else 'yes')) }}
            - action: viva_renamer.voice_alert
              continue_on_error: true
              data:
                intent: "help"
                device_id: "{{ device_id_in }}"
                details: "{{ more_words }}"
              response_variable: pub_more
            - if:
                - condition: template
                  value_template: "{{ pub_more is defined and pub_more is mapping and pub_more.get('published') == true }}"
              then:
                - action: timer.start
                  target:
                    entity_id: timer.vivajot_help_active
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "Okay, I've sent that to your caregiver."
                    preannounce: false
              else:
                - action: assist_satellite.announce
                  continue_on_error: true
                  target:
                    entity_id: "{{ sat_entity }}"
                  data:
                    message: "I couldn't send that. Please use your phone."
                    preannounce: false

      # Unclear twice, or silence (a false wake in an empty room): nothing more is said and
      # nothing is sent. No "I can't hear you" line: a silent answer is the normal false-wake case.
      default: []
